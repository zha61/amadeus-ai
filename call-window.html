<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Incoming Call</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Exo+2:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:340px; height:580px;
  background:#060404;
  color:#f0c8c8;
  font-family:'Exo 2', sans-serif;
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
}

/* Drag strip at the very top — lets user reposition the frameless window */
.drag-strip {
  position:absolute;
  top:0; left:0; right:0;
  height:24px;
  -webkit-app-region:drag;
  z-index:10;
}

/* Red grid background — matches main app aesthetic */
body::before {
  content:'';
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(192,57,43,0.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(192,57,43,0.08) 1px, transparent 1px);
  background-size:28px 28px;
}

/* Subtle top-edge scanline */
body::after {
  content:'';
  position:fixed; top:0; left:0; right:0; height:2px;
  background:rgba(232,64,64,0.4);
  z-index:1; pointer-events:none;
}

.container {
  position:relative; z-index:2;
  display:flex; flex-direction:column;
  align-items:center; justify-content:space-between;
  height:100%;
  padding:36px 24px 32px;
}

/* ── TOP THIRD — logo ── */
.logo-wrap {
  display:flex; flex-direction:column; align-items:center;
  gap:0;
  margin-top:12px;
}

.logo-circle {
  width:120px; height:120px;
  border-radius:50%;
  overflow:hidden;
  background:#0e0808;
  display:flex; align-items:center; justify-content:center;
  animation:logo-glow 1.5s ease-in-out infinite;
  /* border keeps the circle visible on dark bg */
  border:1px solid rgba(192,57,43,0.3);
}

.logo-circle img {
  width:108px; height:108px;
  object-fit:contain;
  /* Logo has a transparent background — no filter needed, orange artwork shows naturally on dark bg */
}

@keyframes logo-glow {
  0%, 100% { box-shadow: 0 0 12px 2px rgba(192,57,43,0.25), 0 0 32px 6px rgba(192,57,43,0.10); }
  50%       { box-shadow: 0 0 24px 6px rgba(192,57,43,0.55), 0 0 60px 14px rgba(192,57,43,0.22); }
}

/* ── MIDDLE — caller info ── */
.caller-info {
  display:flex; flex-direction:column; align-items:center; gap:8px;
  margin-top:4px;
}

.caller-name {
  font-family:'Orbitron', monospace;
  font-size:18px; font-weight:600;
  color:#f0c8c8;
  letter-spacing:0.12em;
  text-shadow:0 0 16px rgba(232,64,64,0.45);
}

.caller-status {
  font-family:'Exo 2', sans-serif;
  font-size:12px; font-weight:300;
  color:#8a6060;
  letter-spacing:0.06em;
  animation:status-pulse 0.6s ease-in-out infinite alternate;
  /* 0.6s offset from logo glow (1.5s) — they feel alive together */
  animation-delay:0.3s;
}

@keyframes status-pulse {
  from { opacity:0.5; }
  to   { opacity:1.0; }
}

/* ── BOTTOM THIRD — buttons + countdown ── */
.controls {
  display:flex; flex-direction:column; align-items:center; gap:16px;
  width:100%;
}

.buttons {
  display:flex; align-items:center; justify-content:center;
  gap:48px;
  -webkit-app-region:no-drag;
}

.call-btn {
  width:64px; height:64px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:transform 0.12s ease, box-shadow 0.12s ease;
  -webkit-app-region:no-drag;
}

.call-btn:active {
  transform:scale(0.92);
}

.btn-decline {
  background:#c0392b;
  box-shadow:0 4px 18px rgba(192,57,43,0.45);
}
.btn-decline:hover {
  box-shadow:0 6px 24px rgba(192,57,43,0.70);
}

.btn-accept {
  background:#27ae60;
  box-shadow:0 4px 18px rgba(39,174,96,0.40);
}
.btn-accept:hover {
  box-shadow:0 6px 24px rgba(39,174,96,0.65);
}

/* Phone SVG icons */
.btn-icon {
  width:28px; height:28px;
  pointer-events:none;
}

.countdown {
  font-family:'Exo 2', sans-serif;
  font-size:12px; font-weight:400;
  color:#8a6060;
  letter-spacing:0.08em;
  -webkit-app-region:no-drag;
}

/* Thin decorative horizontal line */
.divider {
  width:60px; height:1px;
  background:rgba(192,57,43,0.25);
  margin:0 auto;
}
</style>
</head>
<body>

<!-- Drag strip at top — must come before container so z-index works correctly -->
<div class="drag-strip"></div>

<div class="container">

  <!-- Top third: logo -->
  <div class="logo-wrap">
    <div class="logo-circle">
      <img src="amadeus-asset://amadeus_logo.png" alt="Amadeus"/>
    </div>
  </div>

  <!-- Middle: caller info -->
  <div class="caller-info">
    <div class="caller-name">Amadeus</div>
    <div class="divider"></div>
    <div class="caller-status" id="status-text">Incoming call...</div>
  </div>

  <!-- Bottom third: buttons + countdown -->
  <div class="controls">
    <div class="buttons">

      <!-- Decline button (left, red, phone-down) -->
      <button class="call-btn btn-decline" id="btn-decline" title="Decline" onclick="decline()">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
          <!-- Phone with slash — decline call icon -->
          <path d="M1.5 4.5a3 3 0 0 1 3-3h1.372c.86 0 1.61.586 1.819 1.42l1.105 4.423a1.875 1.875 0 0 1-.694 1.955l-1.293.97c-.135.101-.164.249-.126.352a11.285 11.285 0 0 0 6.697 6.697c.103.038.25.009.352-.126l.97-1.293a1.875 1.875 0 0 1 1.955-.694l4.423 1.105c.834.209 1.42.959 1.42 1.82V19.5a3 3 0 0 1-3 3h-2.25C8.552 22.5 1.5 15.448 1.5 6.75V4.5z" transform="rotate(-45 12 12)"/>
        </svg>
      </button>

      <!-- Accept button (right, green, phone) -->
      <button class="call-btn btn-accept" id="btn-accept" title="Accept" onclick="accept()">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
          <path d="M1.5 4.5a3 3 0 0 1 3-3h1.372c.86 0 1.61.586 1.819 1.42l1.105 4.423a1.875 1.875 0 0 1-.694 1.955l-1.293.97c-.135.101-.164.249-.126.352a11.285 11.285 0 0 0 6.697 6.697c.103.038.25.009.352-.126l.97-1.293a1.875 1.875 0 0 1 1.955-.694l4.423 1.105c.834.209 1.42.959 1.42 1.82V19.5a3 3 0 0 1-3 3h-2.25C8.552 22.5 1.5 15.448 1.5 6.75V4.5z"/>
        </svg>
      </button>

    </div>

    <div class="countdown" id="countdown">30s</div>
  </div>

</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let secondsLeft = 30
let dismissed   = false   // guard: only dismiss once (button click OR timer)
let timerInterval = null

// ── Auto-dismiss countdown ────────────────────────────────────────────────────
function startCountdown() {
  const countEl = document.getElementById('countdown')
  timerInterval = setInterval(() => {
    secondsLeft--
    if (countEl) countEl.textContent = secondsLeft + 's'
    if (secondsLeft <= 0) {
      clearInterval(timerInterval)
      decline()  // auto-dismiss as decline when timer expires
    }
  }, 1000)
}

// ── Button handlers ───────────────────────────────────────────────────────────
function decline() {
  if (dismissed) return
  dismissed = true
  if (timerInterval) clearInterval(timerInterval)
  // Update status text briefly so the user sees feedback
  const statusEl = document.getElementById('status-text')
  if (statusEl) statusEl.textContent = 'Dismissed.'
  // Brief visual pause before IPC so the close isn't jarring
  setTimeout(() => {
    if (window.callAPI) window.callAPI.decline()
  }, 120)
}

function accept() {
  if (dismissed) return
  dismissed = true
  if (timerInterval) clearInterval(timerInterval)
  const statusEl = document.getElementById('status-text')
  if (statusEl) statusEl.textContent = 'Connecting...'
  setTimeout(() => {
    if (window.callAPI) window.callAPI.accept()
  }, 120)
}

// ── Boot ─────────────────────────────────────────────────────────────────────
startCountdown()
</script>
</body>
</html>
